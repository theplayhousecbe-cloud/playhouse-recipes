<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playhouse Recipes</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600;700&display=swap');
    body { margin: 0; padding: 0; background: #faf7f4; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 1. CONFIGURATION (REPLACE THESE) ---
    const SUPABASE_URL = 'https://ectiisgvpwxniakspyqn.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjdGlpc2d2cHd4bmlha3NweXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5ODY2NDYsImV4cCI6MjA5MzU2MjY0Nn0.wGXXli987t4SaFyVUwQ3CoEsD8gxvMb-jaC0B91lafM';
    const OWNER_PIN = "1234";

    // Initialize Supabase correctly
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CATEGORIES = ["All", "Veg", "Drink", "Dessert"];
    const EMOJIS = ["🍲","🥗","🍛","🥘","🍜","🫓","🥭","🍰","🧁","🥤","🍱","🥚","🫕","🍮","🧆","🥞"];
    const CAT_COLOR = { Veg:"#2d7a4f", Drink:"#1a6e8e", Dessert:"#8e44ad" };

    const s = {
      input: { width:"100%", padding:"10px 14px", borderRadius:12, border:"1.5px solid #ede5dc", background:"#fff", fontSize:15, color:"#1a1208", outline:"none", fontFamily:"'DM Sans', sans-serif", boxSizing:"border-box" },
      label: { fontSize:13, fontWeight:600, color:"#8a7a6a", marginBottom:5, display:"block" },
      btn: (p) => ({ padding: p ? "13px 0" : "9px 18px", width: p ? "100%" : "auto", background: p ? "#c0392b" : "#fdf6f0", color: p ? "#fff" : "#c0392b", border: p ? "none" : "1.5px solid #f0d8d0", borderRadius:14, fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"'DM Sans', sans-serif" }),
    };

    // --- COMPONENTS ---

    function Badge({ label }) {
      const color = CAT_COLOR[label] || "#888";
      return <span style={{ fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:20, background:color+"18", color, letterSpacing:0.3 }}>{label}</span>;
    }

    function RecipeCard({ recipe, onClick, isOwner, onDelete, onEdit }) {
      const [confirmDelete, setConfirmDelete] = useState(false);
      return (
        <div onClick={onClick} style={{ background:"#fff", borderRadius:18, border:"1px solid #f0ece6", padding:"16px", cursor:"pointer", position:"relative", boxShadow:"0 2px 10px rgba(0,0,0,0.04)" }}>
          {isOwner && (
            <div style={{ position:"absolute", top:12, right:12, display:"flex", gap:6 }}>
              <button onClick={e => { e.stopPropagation(); onEdit(recipe); }} style={{ background:"#eef6ff", border:"none", borderRadius:8, padding:"4px 8px", cursor:"pointer", fontSize:14, color:"#1a6e8e" }}>✏️</button>
              <button onClick={e => { e.stopPropagation(); setConfirmDelete(true); }} style={{ background:"#fff0ee", border:"none", borderRadius:8, padding:"4px 8px", cursor:"pointer", fontSize:14, color:"#c0392b" }}>✕</button>
            </div>
          )}
          {confirmDelete && (
            <div onClick={e => e.stopPropagation()} style={{ position:"absolute", inset:0, background:"rgba(255,255,255,0.95)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", gap:10, zIndex:10 }}>
              <span style={{ fontWeight:700, color:"#c0392b" }}>Delete?</span>
              <button onClick={() => onDelete(recipe.id)} style={s.btn(true)}>Yes</button>
              <button onClick={() => setConfirmDelete(false)} style={s.btn(false)}>No</button>
            </div>
          )}
          <div style={{ fontSize:40, textAlign:"center", background:"#fdf6f0", borderRadius:14, padding:"12px 0", marginBottom:12 }}>{recipe.emoji}</div>
          <h3 style={{ margin:"0 0 6px", fontSize:17, fontWeight:700, color:"#1a1208", fontFamily:"'Playfair Display', serif" }}>{recipe.title}</h3>
          <p style={{ margin:"0 0 10px", fontSize:13, color:"#9a8a7a", lineHeight:1.5 }}>{recipe.description}</p>
          <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
            <Badge label={recipe.category} />
            <span style={{ fontSize:12, color:"#bbb" }}>⏱ {recipe.time}</span>
          </div>
        </div>
      );
    }

    function RecipeDetail({ recipe, onBack }) {
      return (
        <div style={{ paddingBottom:32 }}>
          <button onClick={onBack} style={{ background:"none", border:"none", color:"#c0392b", fontWeight:700, cursor:"pointer", marginBottom:20, fontSize:16 }}>← Back to Feed</button>
          <div style={{ fontSize:56, textAlign:"center", background:"#fdf6f0", borderRadius:20, padding:"18px 0", marginBottom:18 }}>{recipe.emoji}</div>
          <h2 style={{ margin:"0 0 10px", fontSize:24, fontFamily:"'Playfair Display', serif" }}>{recipe.title}</h2>
          <div style={{ display:"flex", gap:10, marginBottom:20 }}><Badge label={recipe.category} /><span>⏱ {recipe.time}</span></div>
          <h3 style={{ fontSize:18, fontFamily:"'Playfair Display', serif" }}>🛒 Ingredients</h3>
          <div style={{ background:"#fdf6f0", borderRadius:16, padding:"12px 16px", marginBottom:20 }}>
            {recipe.ingredients?.map((ing, i) => (
              <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid #f0e8e0" }}>
                <span>{ing.name}</span><span style={{ fontWeight:700, color:"#c0392b" }}>{ing.qty}</span>
              </div>
            ))}
          </div>
          <h3 style={{ fontSize:18, fontFamily:"'Playfair Display', serif" }}>📋 Steps</h3>
          {recipe.steps?.map((step, i) => (
            <div key={i} style={{ display:"flex", gap:12, marginBottom:15 }}>
              <div style={{ width:26, height:26, borderRadius:"50%", background:"#c0392b", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:12, fontWeight:700 }}>{i+1}</div>
              <p style={{ margin:0, lineHeight:1.5 }}>{step}</p>
            </div>
          ))}
        </div>
      );
    }

    function AddRecipeForm({ onAdd, onCancel, editRecipe }) {
      const [form, setForm] = useState(editRecipe || { title:"", description:"", time:"", serves:1, category:"Veg", emoji:"🍲" });
      const [ingredients, setIngredients] = useState(editRecipe?.ingredients || [{ name:"", qty:"" }]);
      const [steps, setSteps] = useState(editRecipe?.steps || [""]);

      const save = () => {
        if (!form.title) return alert("Please add a title");
        onAdd({ ...form, ingredients: ingredients.filter(i => i.name), steps: steps.filter(s => s) });
      };

      return (
        <div style={{ paddingBottom:40 }}>
          <button onClick={onCancel} style={{ marginBottom:20 }}>← Cancel</button>
          <h2 style={{ fontFamily:"'Playfair Display', serif" }}>{editRecipe ? "Edit Recipe" : "New Recipe"}</h2>
          <div style={{ marginBottom:15 }}><label style={s.label}>Title</label><input style={s.input} value={form.title} onChange={e=>setForm({...form, title:e.target.value})} /></div>
          <div style={{ marginBottom:15 }}><label style={s.label}>Ingredients</label>
            {ingredients.map((ing, i) => (
              <div key={i} style={{ display:"flex", gap:5, marginBottom:5 }}>
                <input style={s.input} placeholder="Item" value={ing.name} onChange={e=>{const n=[...ingredients]; n[i].name=e.target.value; setIngredients(n);}} />
                <input style={s.input} placeholder="Qty" value={ing.qty} onChange={e=>{const n=[...ingredients]; n[i].qty=e.target.value; setIngredients(n);}} />
              </div>
            ))}
            <button onClick={()=>setIngredients([...ingredients, {name:"", qty:""}])}>+ Add Ingredient</button>
          </div>
          <div style={{ marginBottom:20 }}><label style={s.label}>Steps</label>
            {steps.map((step, i) => (
              <textarea key={i} style={{ ...s.input, marginBottom:5 }} value={step} onChange={e=>{const n=[...steps]; n[i]=e.target.value; setSteps(n);}} />
            ))}
            <button onClick={()=>setSteps([...steps, ""])}>+ Add Step</button>
          </div>
          <button onClick={save} style={s.btn(true)}>Save to Cloud</button>
        </div>
      );
    }

    // --- MAIN APP ---

    function App() {
      const [recipes, setRecipes] = useState([]);
      const [view, setView] = useState("feed");
      const [selected, setSelected] = useState(null);
      const [isOwner, setIsOwner] = useState(false);
      const [showPin, setShowPin] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);
      const [loading, setLoading] = useState(true);

      const fetchRecipes = async () => {
        const { data, error } = await supabase.from('recipes').select('*').order('id', { ascending: false });
        if (error) console.error("Supabase Error:", error);
        else setRecipes(data || []);
        setLoading(false);
      };

      useEffect(() => { fetchRecipes(); }, []);

      const handleSave = async (recipeData) => {
        const { error } = await supabase.from('recipes').upsert(recipeData);
        if (error) alert("Error saving: " + error.message);
        else { setView("feed"); setEditingRecipe(null); fetchRecipes(); }
      };

      const handleDelete = async (id) => {
        await supabase.from('recipes').delete().eq('id', id);
        fetchRecipes();
      };

      if (loading) return <div style={{ padding:50, textAlign:"center", fontFamily:"'DM Sans', sans-serif" }}>Cooking up your recipes... 🥣</div>;

      return (
        <div style={{ maxWidth:420, margin:"0 auto", padding:20, fontFamily:"'DM Sans', sans-serif", minHeight:"100vh" }}>
          {showPin && (
            <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:100 }}>
              <div style={{ background:"#fff", padding:30, borderRadius:20, textAlign:"center", width:300 }}>
                <h3 style={{ fontFamily:"'Playfair Display', serif" }}>Owner Access</h3>
                <input type="password" style={{ ...s.input, textAlign:"center" }} onChange={e => e.target.value === OWNER_PIN && setIsOwner(true)} placeholder="Enter PIN" />
                <button onClick={() => setShowPin(false)} style={{ marginTop:15, background:"none", border:"none", color:"#888" }}>Close</button>
              </div>
            </div>
          )}

          {view === "feed" && (
            <>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:30 }}>
                <h1 style={{ margin:0, fontSize:28, fontFamily:"'Playfair Display', serif", color:"#1a1208" }}>Playhouse<br/>Recipes 🍴</h1>
                <button onClick={() => isOwner ? setView("add") : setShowPin(true)} style={s.btn(isOwner)}>{isOwner ? "+ New" : "🔐 Owner"}</button>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                {recipes.length === 0 && <p style={{ textAlign:"center", color:"#999" }}>No recipes found in the cloud.</p>}
                {recipes.map(r => (
                  <RecipeCard key={r.id} recipe={r} isOwner={isOwner} onDelete={handleDelete} onEdit={(rec)=>{setEditingRecipe(rec); setView("add");}} onClick={()=> {setSelected(r); setView("detail");}} />
                ))}
              </div>
            </>
          )}

          {view === "detail" && selected && <RecipeDetail recipe={selected} onBack={() => setView("feed")} />}
          {view === "add" && <AddRecipeForm onAdd={handleSave} editRecipe={editingRecipe} onCancel={() => { setEditingRecipe(null); setView("feed"); }} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Playhouse Recipes</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel (to read JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #faf7f4;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

const { useState, useEffect } = React;

function App() {

  const [recipes, setRecipes] = useState([
    {
      id: 1,
      title: "Mango Dice Masala Smash",
      emoji: "🥭",
      category: "Drink",
      description: "Juicy mango + blackcurrant",
    }
  ]);

  const [search, setSearch] = useState("");

  const addRecipe = () => {
    const name = prompt("Enter recipe name");
    if (!name) return;

    setRecipes([{ id: Date.now(), title: name, emoji:"🍲", category:"Veg" }, ...recipes]);
  };

  const deleteRecipe = (id) => {
    setRecipes(recipes.filter(r => r.id !== id));
  };

  const filtered = recipes.filter(r =>
    r.title.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div style={{ maxWidth: 400, margin: "auto", padding: 20 }}>
      <h1>🍴 Playhouse Recipes</h1>

      <input
        placeholder="Search..."
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        style={{ width:"100%", padding:10, marginBottom:10 }}
      />

      <button onClick={addRecipe}>+ Add Recipe</button>

      <div style={{ marginTop:20 }}>
        {filtered.map(r => (
          <div key={r.id} style={{
            background:"#fff",
            padding:12,
            marginBottom:10,
            borderRadius:10
          }}>
            <h3>{r.emoji} {r.title}</h3>
            <p>{r.category}</p>
            <button onClick={() => deleteRecipe(r.id)}>Delete</button>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
